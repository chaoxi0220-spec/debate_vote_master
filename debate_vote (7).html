<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>超级英雄辩论对决 · 现场投票</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --ink:#090c14;
    --navy:#0f1c3f;
    --navy-2:#16265a;
    --blue:#2154ff;
    --blue-dark:#0c2fa0;
    --yellow:#ffd400;
    --yellow-dark:#e0ac00;
    --paper:#f5f3ec;
    --line:#050710;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; height:100%;
    background:var(--ink);
    color:var(--paper);
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    overflow:hidden;
  }
  #app{position:relative; width:100%; height:100vh; height:100dvh; overflow:hidden;}

  /* halftone paper texture, used sparingly as a faint overlay */
  .halftone{
    position:absolute; inset:0; pointer-events:none; z-index:5;
    background-image: radial-gradient(rgba(255,255,255,0.055) 1.1px, transparent 1.1px);
    background-size: 7px 7px;
    mix-blend-mode: overlay;
  }

  .screen{
    position:absolute; inset:0;
    display:none;
    opacity:0;
    transform:scale(0.98);
    transition:opacity .35s ease, transform .35s ease;
  }
  .screen.active{ display:block; opacity:1; transform:scale(1); }

  /* ---------- shared bits ---------- */
  .speedlines{
    position:absolute; inset:0; z-index:0; opacity:.16; pointer-events:none;
    background: repeating-linear-gradient(115deg, transparent 0 18px, rgba(255,255,255,.5) 18px 19px);
  }
  .vs-badge{
    position:absolute; left:50%; top:50%;
    transform:translate(-50%,-50%) rotate(-6deg);
    width:132px; height:132px; z-index:6;
  }
  .vs-badge .burst{
    position:absolute; inset:0;
    fill:var(--paper); stroke:var(--line); stroke-width:6;
    filter:drop-shadow(6px 6px 0 var(--line));
  }
  .vs-badge .txt{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-weight:900; font-size:34px; color:var(--ink); letter-spacing:1px;
    transform:rotate(6deg);
  }

  button{ font-family:inherit; cursor:pointer; }

  /* ================= PAGE 1 : 题目展示 ================= */
  #p1{ }
  .p1-split{ position:absolute; inset:0; }
  .p1-half{ position:absolute; top:0; bottom:0; width:60%; }
  .p1-left{
    left:0; background:linear-gradient(135deg,var(--blue-dark),var(--blue) 65%);
    clip-path:polygon(0 0, 100% 0, 78% 100%, 0% 100%);
  }
  .p1-right{
    right:0; background:linear-gradient(315deg,var(--yellow-dark),var(--yellow) 65%);
    clip-path:polygon(22% 0, 100% 0, 100% 100%, 0% 100%);
  }
  .p1-content{
    position:relative; z-index:7; height:100%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .p1-kicker{
    font-weight:900; font-size:15px; letter-spacing:6px; color:var(--paper);
    background:var(--ink); border:3px solid var(--paper); padding:6px 18px;
    transform:rotate(-2deg); box-shadow:5px 5px 0 rgba(0,0,0,.5);
  }
  .p1-title{
    margin:26px 0 10px; font-weight:900; font-size:clamp(26px,4.4vw,46px);
    line-height:1.28; max-width:820px; color:var(--paper);
    text-shadow:3px 3px 0 var(--line);
  }
  .p1-title b{ color:var(--paper); }
  .stamp-row{
    display:flex; align-items:center; gap:18px; margin-top:6px; flex-wrap:wrap; justify-content:center;
  }
  .stamp{
    font-weight:900; font-size:clamp(28px,4vw,42px); padding:10px 30px;
    border:5px solid var(--line); color:var(--ink);
    box-shadow:7px 7px 0 var(--line);
  }
  .stamp.blue{ background:var(--blue); color:var(--paper); transform:rotate(-5deg); }
  .stamp.yellow{ background:var(--yellow); color:var(--ink); transform:rotate(5deg); }
  .stamp-vs{ font-weight:900; font-size:26px; color:var(--paper); }
  .p1-enter{
    margin-top:46px; background:var(--paper); color:var(--ink);
    border:5px solid var(--line); font-weight:900; font-size:20px;
    padding:16px 46px; box-shadow:8px 8px 0 var(--line);
    transition:transform .12s ease, box-shadow .12s ease;
    animation:pulse 1.8s ease-in-out infinite;
  }
  .p1-enter:active{ transform:translate(6px,6px); box-shadow:2px 2px 0 var(--line); }
  @keyframes pulse{ 0%,100%{transform:scale(1)} 50%{transform:scale(1.045)} }

  /* ---------- QR panel (page 1 & page 3) ---------- */
  .qr-panel{
    position:absolute; z-index:9; display:flex; flex-direction:column; align-items:center; gap:5px;
    background:var(--paper); border:4px solid var(--line); padding:9px 9px 7px;
    box-shadow:5px 5px 0 var(--line);
  }
  #qrPanelP1{ right:16px; bottom:16px; transform:rotate(-2deg); }
  #qrPanelP3{ left:12px; bottom:90px; transform:rotate(2deg); }
  .qr-box{ width:150px; height:150px; display:flex; align-items:center; justify-content:center; background:#fff; }
  .qr-empty{ font-size:10px; font-weight:700; color:#666; text-align:center; line-height:1.35; padding:4px; }
  .qr-caption{ font-weight:900; font-size:11px; letter-spacing:1px; color:var(--ink); }
  .qr-edit{ border:none; background:none; font-size:10px; font-weight:700; color:#5a6690; text-decoration:underline; padding:0; }

  /* ---------- share-link modal ---------- */
  .url-modal{ position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; background:rgba(5,7,16,.72); padding:20px; }
  .url-modal.hidden{ display:none; }
  .url-modal-box{ background:var(--paper); color:var(--ink); border:5px solid var(--line); box-shadow:8px 8px 0 var(--line); padding:22px; width:100%; max-width:360px; }
  .url-modal-title{ font-weight:900; font-size:16px; margin-bottom:12px; }
  .url-modal-box input{ width:100%; padding:10px; border:3px solid var(--line); font-size:14px; font-family:inherit; margin-bottom:14px; box-sizing:border-box; }
  .url-modal-btns{ display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; }
  .url-modal-btns button{ border:4px solid var(--line); font-weight:900; padding:9px 18px; box-shadow:4px 4px 0 var(--line); background:var(--paper); color:var(--ink); font-size:13px; }
  .url-modal-btns button.primary{ background:var(--blue); color:var(--paper); }
  .url-modal-btns button:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--line); }

  /* ================= PAGE 2 : 投票 ================= */
  #p2{ }
  .vote-split{ position:absolute; inset:0; bottom:78px; display:flex; }
  .vote-side{
    position:relative; flex:1; height:100%; padding:16px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; -webkit-user-select:none; user-select:none;
    transition:opacity .25s ease;
  }
  .vote-side:focus-visible{ outline:3px solid var(--paper); outline-offset:-6px; }
  .vote-side.zheng{ background:linear-gradient(160deg,var(--blue-dark),var(--blue)); }
  .vote-side.fan{ background:linear-gradient(200deg,var(--yellow-dark),var(--yellow)); }
  .vote-split.has-vote .vote-side:not(.selected){ opacity:.5; }
  .vote-inner{
    position:relative; z-index:2; display:flex; flex-direction:column; align-items:center; gap:12px;
    transition:transform .18s ease;
  }
  .vote-icon{ width:70px; height:70px; }
  .vote-icon svg{ width:100%; height:100%; }
  .vote-tag{ font-weight:900; font-size:14px; letter-spacing:4px; opacity:.85; }
  .vote-side.zheng .vote-tag{ color:#dfe8ff; }
  .vote-side.fan .vote-tag{ color:#3a2c00; }
  .vote-label{ font-weight:900; font-size:clamp(24px,4vw,36px); }
  .vote-side.zheng .vote-label{ color:var(--paper); }
  .vote-side.fan .vote-label{ color:var(--ink); }
  .vote-btn{
    display:inline-block; margin-top:4px; border:4px solid var(--line); font-weight:900; font-size:15px;
    padding:9px 26px; background:var(--paper); color:var(--ink);
    box-shadow:5px 5px 0 var(--line);
  }
  .vote-side.selected .vote-btn{ background:var(--ink); color:var(--paper); }
  .vote-side.selected .vote-inner{ transform:scale(1.08); }
  .selected-badge{
    position:absolute; top:14px; left:50%; z-index:4;
    transform:translateX(-50%) scale(.5); opacity:0;
    font-weight:900; font-size:13px; letter-spacing:2px; white-space:nowrap;
    background:var(--ink); color:var(--paper); padding:6px 16px;
    border:3px solid var(--paper); box-shadow:4px 4px 0 rgba(0,0,0,.4);
    transition:opacity .2s ease, transform .2s ease;
  }
  .vote-side.selected .selected-badge{ opacity:1; transform:translateX(-50%) scale(1); }

  .p2-hint{
    position:absolute; top:16px; left:0; right:0; text-align:center; z-index:4;
    font-size:14px; font-weight:900; letter-spacing:1px; color:var(--paper);
    padding:0 78px;
  }
  .back-btn{
    position:absolute; top:14px; left:14px; z-index:10;
    background:var(--ink); color:var(--paper); border:3px solid var(--paper);
    font-weight:900; font-size:12px; padding:7px 12px; box-shadow:3px 3px 0 rgba(0,0,0,.4);
  }
  .back-btn:active{ transform:translate(2px,2px); box-shadow:1px 1px 0 rgba(0,0,0,.4); }

  /* ================= PAGE 3 : 战况 ================= */
  #p3{ background:var(--navy); }
  .p3-wrap{
    position:relative; height:100%; padding:26px 20px 96px;
    display:flex; flex-direction:column; align-items:center; z-index:2;
  }
  .p3-title{ font-weight:900; font-size:clamp(18px,3vw,24px); letter-spacing:2px; margin-bottom:6px; text-align:center; }
  .p3-sub{ font-size:12px; color:#9aa4c0; margin-bottom:18px; text-align:center; }

  /* ---------- timer panel ---------- */
  .timer-panel{
    background:var(--ink); border:4px solid var(--line); box-shadow:6px 6px 0 rgba(0,0,0,.35);
    padding:12px 18px 14px; margin-bottom:20px; display:flex; flex-direction:column; align-items:center; gap:8px;
    width:100%; max-width:300px;
  }
  .timer-label{ font-weight:900; font-size:12px; letter-spacing:3px; color:#9aa4c0; }
  .timer-display{ font-weight:900; font-size:clamp(34px,7vw,48px); color:var(--yellow); text-shadow:2px 2px 0 var(--line); font-variant-numeric:tabular-nums; }
  .timer-display.timeup{ color:var(--blue); animation:timeupFlash 1s ease-in-out infinite; }
  @keyframes timeupFlash{ 0%,100%{opacity:1} 50%{opacity:.35} }
  .timer-adjust{ display:flex; gap:6px; }
  .timer-adjust button{ border:3px solid var(--line); background:var(--paper); color:var(--ink); font-weight:900; font-size:12px; padding:6px 10px; box-shadow:3px 3px 0 var(--line); }
  .timer-adjust button:disabled{ opacity:.35; }
  .timer-adjust button:not(:disabled):active{ transform:translate(2px,2px); box-shadow:1px 1px 0 var(--line); }
  .timer-controls{ display:flex; gap:8px; margin-top:2px; }
  .timer-controls button{ border:4px solid var(--line); font-weight:900; font-size:14px; padding:8px 22px; box-shadow:4px 4px 0 var(--line); }
  .timer-controls button:active{ transform:translate(3px,3px); box-shadow:1px 1px 0 var(--line); }
  #timerToggle{ background:var(--yellow); color:var(--ink); }
  #timerToggle.running{ background:var(--blue); color:var(--paper); }
  #timerReset{ background:var(--paper); color:var(--ink); }

  .score-row{ display:flex; align-items:center; justify-content:center; gap:14px; width:100%; max-width:640px; margin-bottom:20px; }
  .score-box{ flex:1; text-align:center; }
  .score-num{ font-weight:900; font-size:clamp(38px,9vw,64px); line-height:1; }
  .score-box.zheng .score-num{ color:var(--blue); text-shadow:3px 3px 0 var(--line); }
  .score-box.fan .score-num{ color:var(--yellow); text-shadow:3px 3px 0 var(--line); }
  .score-box .pct-lbl{ font-size:13px; font-weight:700; color:#c9d0e8; margin-top:2px; }
  .score-box .side-lbl{ font-size:12px; font-weight:900; letter-spacing:3px; color:#7f8ab0; margin-top:4px; }
  .score-vs{ font-weight:900; font-size:20px; color:#5a6690; padding-top:8px; }

  .meter{
    position:relative; width:100%; max-width:640px; height:46px;
    border:4px solid var(--line); background:var(--ink); overflow:hidden;
    box-shadow:6px 6px 0 rgba(0,0,0,.35); margin-bottom:8px;
  }
  .meter-fill{ position:absolute; top:0; bottom:0; transition:width .5s cubic-bezier(.2,.8,.2,1); }
  .meter-fill.zheng{ left:0; background:linear-gradient(90deg,var(--blue-dark),var(--blue)); }
  .meter-fill.fan{ right:0; background:linear-gradient(270deg,var(--yellow-dark),var(--yellow)); }
  .meter-spark{
    position:absolute; top:50%; width:34px; height:34px; transform:translate(-50%,-50%);
    transition:left .5s cubic-bezier(.2,.8,.2,1); z-index:4; filter:drop-shadow(0 0 6px rgba(255,255,255,.7));
  }
  .meter-clash{ position:absolute; inset:0; display:flex; }

  .total-votes{ font-size:12px; color:#7f8ab0; margin-top:6px; margin-bottom:30px; }

  .lead-banner{
    font-weight:900; font-size:15px; padding:9px 22px; border:3px solid var(--line);
    box-shadow:4px 4px 0 var(--line); transform:rotate(-2deg); transition:background .3s,color .3s;
  }

  .arena-shield{
    position:absolute; right:-40px; bottom:-40px; width:280px; height:280px; opacity:.06; z-index:1;
  }

  /* ---------- bottom tab bar (page2 & page3) ---------- */
  .tabbar{
    position:absolute; left:0; right:0; bottom:0; height:78px; z-index:8;
    display:flex; background:var(--ink); border-top:4px solid var(--line);
  }
  .tab{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    background:none; border:none; color:#7f8ab0; font-weight:900; font-size:13px; letter-spacing:1px;
    border-right:2px solid #1c2440;
  }
  .tab:last-child{ border-right:none; }
  .tab svg{ width:22px; height:22px; opacity:.6; transition:opacity .2s; }
  .tab.active{ color:var(--paper); }
  .tab.active svg{ opacity:1; }
  .tab-indicator{
    position:absolute; top:-4px; left:0; width:50%; height:4px; background:var(--yellow);
    transition:transform .25s ease;
  }
  .tab-indicator.to-p3{ transform:translateX(100%); }

  .flash{ animation:flashnum .5s ease; }
  @keyframes flashnum{ 0%{ transform:scale(1.35); } 100%{ transform:scale(1); } }

  @media (max-width:700px){
    .p1-left{ clip-path:polygon(0 0, 100% 0, 100% 46%, 0 62%); width:100%; height:70%; }
    .p1-right{ clip-path:polygon(0 54%, 100% 38%, 100% 100%, 0 100%); width:100%; height:70%; top:auto; bottom:0; }
    .vote-split{ flex-direction:column; }
    .vs-badge{ width:88px; height:88px; }
    .vs-badge .txt{ font-size:24px; }
    #qrPanelP1{ right:10px; bottom:10px; }
    #qrPanelP3{ left:8px; bottom:86px; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- ============ PAGE 1 ============ -->
  <section class="screen active" id="p1">
    <div class="p1-split">
      <div class="p1-half p1-left"></div>
      <div class="p1-half p1-right"></div>
    </div>
    <div class="speedlines"></div>
    <div class="p1-content">
      <span class="p1-kicker">辩论社 · 表演赛</span>
      <h1 class="p1-title">超级英雄的出现，<br>是社会的<b>福音</b>还是<b>危机</b>？</h1>
      <div class="stamp-row">
        <div class="stamp blue">福 音</div>
        <div class="stamp-vs">VS</div>
        <div class="stamp yellow">危 机</div>
      </div>
      <button class="p1-enter" id="btnEnter">观众投票入场 →</button>
    </div>
    <div class="qr-panel" id="qrPanelP1">
      <div class="qr-box" id="qrP1"></div>
      <div class="qr-caption">扫码投票</div>
      <button type="button" class="qr-edit" data-editqr="1">设置链接</button>
    </div>
    <div class="halftone"></div>
  </section>

  <!-- ============ PAGE 2 : 投票 ============ -->
  <section class="screen" id="p2">
    <button class="back-btn" id="btnBackP2">← 主页</button>
    <div class="p2-hint" id="voteStatus">选一方 · 投票可随时切换</div>
    <div class="vote-split" id="voteSplit">
      <div class="vote-side zheng" id="btnZheng" role="button" tabindex="0">
        <div class="selected-badge">已投票 ✓</div>
        <div class="vote-inner">
          <div class="vote-icon">
            <svg viewBox="0 0 100 100"><path fill="#f5f3ec" stroke="#050710" stroke-width="4" d="M50 8C30 8 18 22 18 40l0 20c0 12 12 22 32 28 20-6 32-16 32-28l0-20C82 22 70 8 50 8Z"/><path fill="#050710" d="M28 40h18l-4 12H28z"/><path fill="#050710" d="M72 40H54l4 12h14z"/><rect x="45" y="56" width="10" height="15" fill="#ffd400" stroke="#050710" stroke-width="2.5"/></svg>
          </div>
          <div class="vote-tag">正方 · PRO</div>
          <div class="vote-label">福音</div>
          <span class="vote-btn">投给正方</span>
        </div>
      </div>
      <div class="vote-side fan" id="btnFan" role="button" tabindex="0">
        <div class="selected-badge">已投票 ✓</div>
        <div class="vote-inner">
          <div class="vote-icon">
            <svg viewBox="0 0 100 100"><path fill="#050710" d="M50 10c8 0 14 6 14 14v10c14-4 26 6 28 20-12-6-22-4-28 2v14c0 12-6 20-14 22-8-2-14-10-14-22V56c-6-6-16-8-28-2 2-14 14-24 28-20V24c0-8 6-14 14-14z"/><circle cx="50" cy="46" r="9" fill="#ffd400" stroke="#050710" stroke-width="3"/></svg>
          </div>
          <div class="vote-tag">反方 · CON</div>
          <div class="vote-label">危机</div>
          <span class="vote-btn">投给反方</span>
        </div>
      </div>
    </div>
    <div class="vs-badge">
      <svg class="burst" viewBox="0 0 100 100"><polygon points="50,2 61,22 82,15 78,38 98,50 78,62 82,85 61,78 50,98 39,78 18,85 22,62 2,50 22,38 18,15 39,22"/></svg>
      <div class="txt">VS</div>
    </div>
    <nav class="tabbar" id="tabbar2">
      <div class="tab-indicator" id="tabInd2"></div>
      <button class="tab active" data-go="p2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 12h8M8 16h5"/></svg>
        投票
      </button>
      <button class="tab" data-go="p3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        战况
      </button>
    </nav>
  </section>

  <!-- ============ PAGE 3 : 战况 ============ -->
  <section class="screen" id="p3">
    <button class="back-btn" id="btnBackP3">← 主页</button>
    <svg class="arena-shield" viewBox="0 0 100 100"><path fill="#f5f3ec" d="M50 4 90 18v28c0 28-18 44-40 50C28 90 10 74 10 46V18z"/></svg>
    <div class="speedlines"></div>
    <div class="p3-wrap">
      <div class="p3-title">现场战况</div>
      <div class="p3-sub" id="totalHint">等待第一票投出…</div>

      <div class="timer-panel">
        <div class="timer-label">发言时间</div>
        <div class="timer-display" id="timerDisplay">03:00</div>
        <div class="timer-adjust">
          <button type="button" data-d="-30">-30s</button>
          <button type="button" data-d="-10">-10s</button>
          <button type="button" data-d="10">+10s</button>
          <button type="button" data-d="30">+30s</button>
        </div>
        <div class="timer-controls">
          <button type="button" id="timerToggle">开始</button>
          <button type="button" id="timerReset">重置</button>
        </div>
      </div>

      <div class="score-row">
        <div class="score-box zheng">
          <div class="score-num" id="numZheng">0</div>
          <div class="pct-lbl" id="pctZheng">50%</div>
          <div class="side-lbl">正方 · 福音</div>
        </div>
        <div class="score-vs">VS</div>
        <div class="score-box fan">
          <div class="score-num" id="numFan">0</div>
          <div class="pct-lbl" id="pctFan">50%</div>
          <div class="side-lbl">反方 · 危机</div>
        </div>
      </div>

      <div class="meter">
        <div class="meter-fill zheng" id="fillZheng" style="width:50%"></div>
        <div class="meter-fill fan" id="fillFan" style="width:50%"></div>
      </div>
      <svg class="meter-spark" id="meterSpark" style="left:50%" viewBox="0 0 100 100"><polygon fill="#ffffff" stroke="#050710" stroke-width="4" points="50,2 61,22 82,15 78,38 98,50 78,62 82,85 61,78 50,98 39,78 18,85 22,62 2,50 22,38 18,15 39,22"/></svg>

      <div class="lead-banner" id="leadBanner">势均力敌，胜负未分！</div>
    </div>
    <div class="qr-panel" id="qrPanelP3">
      <div class="qr-box" id="qrP3"></div>
      <div class="qr-caption">扫码投票</div>
      <button type="button" class="qr-edit" data-editqr="1">设置链接</button>
    </div>
    <nav class="tabbar" id="tabbar3">
      <div class="tab-indicator to-p3" id="tabInd3"></div>
      <button class="tab" data-go="p2">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="4" width="16" height="16" rx="1"/><path d="M8 12h8M8 16h5"/></svg>
        投票
      </button>
      <button class="tab active" data-go="p3">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 20V10M12 20V4M20 20v-7"/></svg>
        战况
      </button>
    </nav>
  </section>

  <div class="url-modal hidden" id="urlModal">
    <div class="url-modal-box">
      <div class="url-modal-title">设置投票页分享链接</div>
      <input type="text" id="urlInput" placeholder="粘贴分享出去的网页链接">
      <div class="url-modal-btns">
        <button type="button" id="urlCancel">取消</button>
        <button type="button" id="urlSave" class="primary">保存并生成二维码</button>
      </div>
    </div>
  </div>

</div>

<script>
(function(){
  const screens = {p1:document.getElementById('p1'), p2:document.getElementById('p2'), p3:document.getElementById('p3')};
  let myVote = null; // 'zheng' | 'fan' | null
  let lastZheng = null, lastFan = null;

  function goto(id){
    Object.values(screens).forEach(s=>s.classList.remove('active'));
    screens[id].classList.add('active');
    document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active', t.dataset.go===id));
    const ind2 = document.getElementById('tabInd2');
    const ind3 = document.getElementById('tabInd3');
    if(ind2) ind2.classList.toggle('to-p3', id==='p3');
    if(ind3) ind3.classList.toggle('to-p3', id==='p3');
    if(id==='p3'){ refreshResults(); refreshTimerFromShared(); }
  }

  document.getElementById('btnEnter').addEventListener('click', ()=> goto('p2'));
  document.getElementById('btnBackP2').addEventListener('click', ()=> goto('p1'));
  document.getElementById('btnBackP3').addEventListener('click', ()=> goto('p1'));
  document.querySelectorAll('.tab').forEach(btn=>{
    btn.addEventListener('click', ()=> goto(btn.dataset.go));
  });

  // ---------- storage helpers ----------
  async function getShared(){
    try{
      const res = await window.storage.get('votes', true);
      if(res && res.value) return JSON.parse(res.value);
      return null;
    }catch(e){ return null; }
  }
  async function ensureShared(){
    let v = await getShared();
    if(!v){
      v = {zheng:0, fan:0};
      try{ await window.storage.set('votes', JSON.stringify(v), true); }catch(e){}
    }
    return v;
  }
  async function setShared(v){
    try{ await window.storage.set('votes', JSON.stringify(v), true); }catch(e){}
  }
  async function getMyVote(){
    try{
      const res = await window.storage.get('myVote', false);
      return (res && res.value) ? res.value : null;
    }catch(e){ return null; }
  }
  async function setMyVoteStore(side){
    try{ await window.storage.set('myVote', side, false); }catch(e){}
  }
  async function getShareUrl(){
    try{
      const res = await window.storage.get('shareUrl', true);
      return (res && res.value) ? res.value : '';
    }catch(e){ return ''; }
  }
  async function setShareUrlStore(url){
    try{ await window.storage.set('shareUrl', url, true); }catch(e){}
  }
  async function getTimerShared(){
    try{
      const res = await window.storage.get('timer', true);
      if(res && res.value) return JSON.parse(res.value);
      return null;
    }catch(e){ return null; }
  }
  async function setTimerShared(t){
    try{ await window.storage.set('timer', JSON.stringify(t), true); }catch(e){}
  }

  function paintSelection(){
    document.getElementById('btnZheng').classList.toggle('selected', myVote==='zheng');
    document.getElementById('btnFan').classList.toggle('selected', myVote==='fan');
    document.getElementById('voteSplit').classList.toggle('has-vote', !!myVote);
    const status = document.getElementById('voteStatus');
    if(myVote==='zheng') status.textContent = '你投的是 正方 · 福音 ✓（可随时改投）';
    else if(myVote==='fan') status.textContent = '你投的是 反方 · 危机 ✓（可随时改投）';
    else status.textContent = '选一方 · 投票可随时切换';
  }

  let busy = false;
  async function castVote(side){
    if(busy) return;
    if(myVote===side) return;
    busy = true;
    try{
      const votes = await ensureShared();
      if(myVote==='zheng') votes.zheng = Math.max(0, votes.zheng-1);
      if(myVote==='fan') votes.fan = Math.max(0, votes.fan-1);
      votes[side] = (votes[side]||0) + 1;
      await setShared(votes);
      await setMyVoteStore(side);
      myVote = side;
      paintSelection();
      await refreshResults();
    } finally { busy = false; }
  }

  document.getElementById('btnZheng').addEventListener('click', ()=>castVote('zheng'));
  document.getElementById('btnFan').addEventListener('click', ()=>castVote('fan'));
  [['btnZheng','zheng'],['btnFan','fan']].forEach(([id,side])=>{
    document.getElementById(id).addEventListener('keydown', (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); castVote(side); }
    });
  });

  function animateNum(el, from, to){
    if(from===to){ el.textContent = to; return; }
    el.textContent = to;
    el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
  }

  async function refreshResults(){
    const v = await ensureShared();
    const z = v.zheng||0, f = v.fan||0;
    const total = z+f;
    const pz = total? Math.round((z/total)*100) : 50;
    const pf = total? 100-pz : 50;

    animateNum(document.getElementById('numZheng'), lastZheng, z);
    animateNum(document.getElementById('numFan'), lastFan, f);
    lastZheng = z; lastFan = f;

    document.getElementById('pctZheng').textContent = pz+'%';
    document.getElementById('pctFan').textContent = pf+'%';
    document.getElementById('fillZheng').style.width = pz+'%';
    document.getElementById('fillFan').style.width = pf+'%';
    document.getElementById('meterSpark').style.left = pz+'%';

    const hint = document.getElementById('totalHint');
    hint.textContent = total? ('共 '+total+' 票 · 实时更新中') : '等待第一票投出…';

    const banner = document.getElementById('leadBanner');
    if(total===0){
      banner.textContent = '势均力敌，胜负未分！';
      banner.style.background = 'var(--paper)'; banner.style.color='var(--ink)';
    } else if(pz===pf){
      banner.textContent = '势均力敌，胜负未分！';
      banner.style.background = 'var(--paper)'; banner.style.color='var(--ink)';
    } else if(pz>pf){
      banner.textContent = '正方 · 福音方 暂时领先！';
      banner.style.background = 'var(--blue)'; banner.style.color='var(--paper)';
    } else {
      banner.textContent = '反方 · 危机方 暂时领先！';
      banner.style.background = 'var(--yellow)'; banner.style.color='var(--ink)';
    }
  }

  // ---------- QR / share link ----------
  let currentShareUrl = '';
  function renderQR(url){
    currentShareUrl = url;
    ['qrP1','qrP3'].forEach(id=>{
      const el = document.getElementById(id);
      if(!el) return;
      el.innerHTML = '';
      if(!url){
        el.innerHTML = '<div class="qr-empty">还没设置链接<br>点下面"设置链接"</div>';
        return;
      }
      try{
        new QRCode(el, {text:url, width:150, height:150, colorDark:"#050710", colorLight:"#ffffff", correctLevel: QRCode.CorrectLevel.M});
      }catch(e){
        el.innerHTML = '<div class="qr-empty">二维码生成失败</div>';
      }
    });
  }
  const urlModal = document.getElementById('urlModal');
  const urlInput = document.getElementById('urlInput');
  function openUrlModal(){
    let guess = currentShareUrl;
    if(!guess && !/^blob:|^about:|^data:/.test(location.href)) guess = location.href;
    urlInput.value = guess || '';
    urlModal.classList.remove('hidden');
    urlInput.focus();
  }
  function closeUrlModal(){ urlModal.classList.add('hidden'); }
  document.querySelectorAll('[data-editqr]').forEach(b=> b.addEventListener('click', openUrlModal));
  document.getElementById('urlCancel').addEventListener('click', closeUrlModal);
  document.getElementById('urlSave').addEventListener('click', async ()=>{
    const val = urlInput.value.trim();
    if(!val) return;
    await setShareUrlStore(val);
    renderQR(val);
    closeUrlModal();
  });
  urlModal.addEventListener('click', (e)=>{ if(e.target===urlModal) closeUrlModal(); });

  // ---------- timer ----------
  let timerState = {duration:180, remaining:180, endAt:null, running:false};
  function fmtTime(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec/60), s = sec%60;
    return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
  }
  function currentRemaining(){
    if(timerState.running && timerState.endAt){
      return Math.max(0, (timerState.endAt - Date.now())/1000);
    }
    return timerState.remaining;
  }
  function paintTimer(){
    const disp = document.getElementById('timerDisplay');
    const rem = currentRemaining();
    disp.textContent = fmtTime(rem);
    disp.classList.toggle('timeup', rem<=0 && !timerState.running);
    const toggle = document.getElementById('timerToggle');
    toggle.textContent = timerState.running ? '暂停' : (rem<=0 ? '重新开始' : '开始');
    toggle.classList.toggle('running', timerState.running);
    document.querySelectorAll('.timer-adjust button').forEach(b=> b.disabled = timerState.running);
  }
  async function timerAdjust(delta){
    if(timerState.running) return;
    timerState.remaining = Math.max(0, Math.min(3599, timerState.remaining + delta));
    timerState.duration = timerState.remaining;
    timerState.endAt = null;
    await setTimerShared(timerState);
    paintTimer();
  }
  async function timerToggleFn(){
    if(timerState.running){
      timerState.remaining = currentRemaining();
      timerState.running = false;
      timerState.endAt = null;
    } else {
      if(currentRemaining() <= 0) timerState.remaining = timerState.duration;
      timerState.endAt = Date.now() + timerState.remaining*1000;
      timerState.running = true;
    }
    await setTimerShared(timerState);
    paintTimer();
  }
  async function timerResetFn(){
    timerState.remaining = timerState.duration;
    timerState.running = false;
    timerState.endAt = null;
    await setTimerShared(timerState);
    paintTimer();
  }
  document.querySelectorAll('.timer-adjust button').forEach(b=>{
    b.addEventListener('click', ()=> timerAdjust(parseInt(b.dataset.d,10)));
  });
  document.getElementById('timerToggle').addEventListener('click', timerToggleFn);
  document.getElementById('timerReset').addEventListener('click', timerResetFn);

  function tickTimer(){
    if(timerState.running){
      const rem = currentRemaining();
      if(rem<=0){
        timerState.running=false; timerState.remaining=0; timerState.endAt=null;
        setTimerShared(timerState);
      }
      paintTimer();
    }
  }
  async function refreshTimerFromShared(){
    const t = await getTimerShared();
    if(t){ timerState = t; }
    else { await setTimerShared(timerState); }
    paintTimer();
  }

  async function init(){
    myVote = await getMyVote();
    paintSelection();
    await ensureShared();
    await refreshResults();

    const su = await getShareUrl();
    renderQR(su);

    await refreshTimerFromShared();

    setInterval(()=>{ refreshResults(); refreshTimerFromShared(); }, 2200);
    setInterval(tickTimer, 1000);
  }
  init();
})();
</script>
</body>
</html>
